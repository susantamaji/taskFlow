services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/taskflow
      PORT: 5000
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  client:
    build: ./client
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "5173:80"
volumes:
  mongo_data:
